git:
  # Commits are SSH-signed via ssh-agent with no prompt (nix/modules/home/git.nix),
  # so lazygit can reword/rebase in place.
  overrideGpg: true
  # Cycle renderers in the diff view. delta's line numbers are links: clicking
  # one opens $EDITOR at that line (lazygit-edit://).
  diffRenderers:
    # No file header (lazygit shows it) and no box lines around hunk headers.
    # Colors: [delta] in nix/modules/home/git.nix.
    - command: delta --paging=never --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}" --file-style=omit --hunk-header-decoration-style=none --hunk-header-style="line-number syntax" --line-numbers --line-numbers-left-format="{nm:>4} " --line-numbers-right-format="{np:>4}  "
    - type: extDiff
      command: difft --color=always
os:
  editPreset: nvim # "e" on a file; commit messages use git's core.editor
