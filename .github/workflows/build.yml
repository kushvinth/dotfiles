name: Build

# One job per system; each builds that system's `checks` from nix/flake.nix
# (darwin hosts + packages on macOS; on Linux the per-project dev guest:
# nixosConfigurations.dev-guest and its erofs store disk,
# nix/modules/dev/guest.nix). The macOS job builds the Mac with a stub
# for the guest's boot artefacts, since it can't build Linux.
on:
  workflow_call:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  # Cheap and fast: evaluates every system's checks before the slow builds start.
  eval:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-nix
        with:
          cache: eval
          max-store-size: "2000000000"

      - run: nix flake check ./nix --no-build --all-systems

  build:
    needs: [eval]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            system: aarch64-darwin
            desc: MacbookPro, packages
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
            desc: dev-guest + store disk
    name: "${{ matrix.system }}: ${{ matrix.desc }}"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-nix
        with:
          cache: build

      # flake check only builds the checks of the system it runs on.
      - run: nix flake check ./nix

      # TODO: push the aarch64-linux dev-guest outputs (toplevel, store disk,
      # kernel, initrd) to a binary cache (cachix/attic) so the Mac substitutes
      # them instead of building on its linux-builder. Needs a cache token as a
      # repository secret; none is configured yet.
