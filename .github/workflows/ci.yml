name: CI

# Orchestrator: decides what changed, then calls the reusable workflows.
# See README.md next to this file.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# PR runs cancel older runs of the same PR; main runs never cancel (run_id is unique).
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  prepare:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      nix: ${{ steps.filter.outputs.nix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0 # push events diff against the previous main commit
          persist-credentials: false

      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        with:
          filters: |
            nix:
              - 'nix/**'
              - '.github/actions/setup-nix/**'
              - '.github/workflows/build.yml'
              - '.github/workflows/switch.yml'

  lint:
    name: Lint
    needs: [prepare]
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the PR's commits

  build:
    name: Build
    needs: [prepare]
    if: needs.prepare.outputs.nix == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  # The PR build already proves the closure; the slow scratch switch runs on main.
  switch:
    name: Switch
    needs: [prepare, build]
    if: |
      github.event_name == 'workflow_dispatch'
      || (needs.prepare.outputs.nix == 'true' && github.ref == 'refs/heads/main')
    uses: ./.github/workflows/switch.yml
    permissions:
      contents: read

  # The only required status check. Skipped jobs pass; failed or cancelled ones don't.
  # Never rename it: branch protection matches on the name.
  ci-ok:
    name: ci ok
    if: always()
    needs: [lint, build, switch]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success | skipped) ;; *) exit 1 ;; esac
          done
