name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      shell: ${{ steps.filter.outputs.shell }}
      lua: ${{ steps.filter.outputs.lua }}
      yaml: ${{ steps.filter.outputs.yaml }}
      markdown: ${{ steps.filter.outputs.markdown }}
      nix: ${{ steps.filter.outputs.nix }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            shell:
              - '**/*.sh'
              - '**/*.bash'
              - '**/.zshrc'
              - '**/.bashrc'
              - '**/sketchybarrc'
              - '**/skhdrc'
            lua:
              - '**/*.lua'
            yaml:
              - '**/*.yml'
              - '**/*.yaml'
            markdown:
              - '**/*.md'
            nix:
              - 'nix/**'
              - '**/*.nix'
            workflows:
              - '.github/workflows/**'

  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: |
      needs.changes.outputs.shell == 'true'
      || needs.changes.outputs.lua == 'true'
      || needs.changes.outputs.yaml == 'true'
      || needs.changes.outputs.markdown == 'true'
      || needs.changes.outputs.workflows == 'true'
      || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files

  zizmor:
    name: Security Scan (workflows)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.workflows == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Run zizmor on GitHub Actions
        run: |
          docker run --rm --network none -v "$PWD":/work:ro \
            ghcr.io/woodruffw/zizmor:latest --offline /work/.github/workflows

  validate-nix:
    name: Validate Nix flake
    runs-on: macos-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.nix == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: Flake check (evaluate only)
        run: nix flake check ./nix --no-build

      - name: Check Nix formatting
        run: cd nix && nix fmt . -- --check
        continue-on-error: true

  build-nix:
    name: Build Nix system
    runs-on: macos-latest
    timeout-minutes: 60
    needs: changes
    if: |
      needs.changes.outputs.nix == 'true'
      && (github.ref == 'refs/heads/main'
         || github.ref == 'refs/heads/master'
         || github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: Build darwin configuration
        run: nix build ./nix#darwinConfigurations.MacbookPro.config.system.build.toplevel

  validate-stow:
    name: Validate Stow layout
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Install Stow
        run: sudo apt-get install -y stow

      - name: Dry-run stow from repo root
        run: |
          set -e
          HOME_TEST="$RUNNER_TEMP/home"
          mkdir -p "$HOME_TEST"
          stow -n -v --target="$HOME_TEST" --dotfiles .

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Check for hardcoded secrets
        run: |
          echo "Scanning for potential secrets..."
          grep -rn --include="*.sh" --include="*.zsh" --include=".zshrc" \
            -E "(password|secret|api_key|token)[\s]*=[\s]*['\"][^'\"]+['\"]" . || echo "No hardcoded secrets found"
