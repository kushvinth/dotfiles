name: Setup Nix
description: Install Nix and restore/save the /nix/store from the GitHub Actions cache.

inputs:
  cache:
    description: Cache name, so jobs with different closures don't evict each other.
    required: true
  max-store-size:
    description: Store is garbage-collected down to this many bytes before saving.
    default: "5000000000"

runs:
  using: composite
  steps:
    # Upstream Nix, not Determinate: nix-darwin runs the daemon (nix.enable = true).
    - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      with:
        github_access_token: ${{ github.token }}

    # Only main saves: PR caches are scoped to their ref and would only fill the 10 GB quota.
    - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
      with:
        primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache }}-${{ hashFiles('nix/flake.lock') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache }}-
        save: ${{ github.ref == 'refs/heads/main' }}
        gc-max-store-size: ${{ inputs.max-store-size }}
